development:
  clients:
    default: &default
      database: smart_booker_development
      hosts:
        - mongo:27017
      options:
        user: mongo
        password: mongo
        auth_source: admin
        auth_mech: :scram256
test:
  clients:
    default:
      <<: *default
      database: smart_booker_test
      options:
        read:
          mode: :primary
        max_pool_size: 1
